<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Planning Poker</title>
  <!-- Back card, fanned to the left -->
  <rect x="3.5" y="3" width="11" height="15" rx="2" fill="#579DFF" transform="rotate(-14 9 10.5)"/>
  <!-- Front card with a diamond pip; the white edge keeps the cards distinct in dark mode -->
  <g transform="rotate(8 14.5 13.5)">
    <rect x="9" y="6" width="11" height="15" rx="2" fill="#0C66E4" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M14.5 9.6 L17.4 13.5 L14.5 17.4 L11.6 13.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
