modules:
  jira:issuePanel:
    - key: planning-poker-panel
      resource: main
      resolver:
        function: resolver
      title: Planning Poker
      icon: resource:main;icon.svg
      viewportSize: large
  jira:projectPage:
    - key: planning-poker-refinement
      resource: main
      resolver:
        function: resolver
      title: Planning Poker
      icon: resource:main;icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/planning-poker/build
permissions:
  scopes:
    - storage:app
    - read:jira-user
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/deb33b6c-f617-4290-bfe8-a8500d4db3e2
