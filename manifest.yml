modules:
  jira:issuePanel:
    - key: planning-poker-panel
      resource: main
      resolver:
        function: resolver
      title: Planning Poker
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      viewportSize: large
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/planning-poker/build
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/deb33b6c-f617-4290-bfe8-a8500d4db3e2
